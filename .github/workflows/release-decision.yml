name: 5b. Décision go/no-go
# Le responsable release approuve via l'environnement GitHub « go-no-go » (relecteur
# obligatoire). La décision est enregistrée dans releases/journal.csv.
on:
  workflow_dispatch:
    inputs:
      release:
        description: Identifiant (ex. R-2027.1)
        required: true
      decision:
        type: choice
        options: [go, go-sous-conditions, no-go]
      conditions:
        description: Conditions (ex. EP-602 livrée avec le feature flag désactivé)
        default: ""
permissions:
  contents: write
  actions: read
jobs:
  decision:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: go-no-go
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE: ${{ inputs.release }}
      DECISION: ${{ inputs.decision }}
      CONDITIONS: ${{ inputs.conditions }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/preparer
      - id: approbation
        run: |
          echo "$RELEASE" | grep -Eq '^R-[0-9]{4}\.[0-9]+$' || { echo "Release invalide" >&2; exit 1; }
          qui=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/approvals" --jq '.[0].user.login // empty' || true)
          echo "par=${qui:-${GITHUB_ACTOR}}" >> "$GITHUB_OUTPUT"
      - id: journal
        env:
          PAR: ${{ steps.approbation.outputs.par }}
          EXIGER: ${{ vars.EXIGER_ROLES == 'true' && 'RESPONSABLE-RELEASE' || '' }}
        run: |
          python scripts/journal.py release --release "$RELEASE" --decision "$DECISION" \
            --conditions "$CONDITIONS" --par "$PAR" --exiger-role "$EXIGER"
          python scripts/synthese.py > /dev/null
      - uses: ./.github/actions/commit
        with:
          chemins: releases/journal.csv reports/SYNTHESE.md
          message: "Release ${{ inputs.release }} : ${{ inputs.decision }} par ${{ steps.journal.outputs.role }} (@${{ steps.approbation.outputs.par }})"
